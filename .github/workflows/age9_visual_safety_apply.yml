name: Apply Age 9 visual safety review

on:
  push:
    branches: [main]
    paths:
      - "scripts/approve_age9_visual_plans.py"
      - "data/age9_visual_safety_policy.json"
      - ".github/workflows/age9_visual_safety_apply.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply Age 9 visual semantic review
        run: python scripts/approve_age9_visual_plans.py

      - name: Verify Age 9 production readiness
        run: |
          python scripts/approve_age9_visual_plans.py --check
          python scripts/qa_age_production.py --age 9 --production-ready

      - name: Commit approved Age 9 visual plans
        run: |
          if git diff --quiet -- data/poems.csv data/age9_visual_safety_report.json; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/poems.csv data/age9_visual_safety_report.json
          git commit -m "Approve Age 9 visual plans"
          git push
