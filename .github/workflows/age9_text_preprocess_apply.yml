name: Apply Age 9 text preprocessing

on:
  push:
    branches: [main]
    paths:
      - "scripts/prepare_age9_text.py"
      - ".github/workflows/age9_text_preprocess_apply.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare Age 9 text layer
        run: python scripts/prepare_age9_text.py

      - name: Commit generated Age 9 preprocessing data
        run: |
          if git diff --quiet -- data/poems.csv data/age9_text_inventory.json; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/poems.csv data/age9_text_inventory.json
          git commit -m "Apply Age 9 text preprocessing"
          git push
