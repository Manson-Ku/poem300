name: Preproduction QA

on:
  push:
    branches: [main]
    paths:
      - "data/poems.csv"
      - "data/scenes.csv"
      - "data/bopomofo_overrides.json"
      - "data/bpmf_font_extensions.json"
      - "data/tts_pronunciation_overrides.json"
      - "data/tts_pronunciation_proxy_registry.json"
      - "data/pronunciation_candidates_age8.json"
      - "data/age9_text_inventory.json"
      - "data/pronunciation_candidates_age9.json"
      - "scripts/inventory_pronunciation.py"
      - "scripts/prepare_age9_text.py"
      - "scripts/generate_tts_assets.py"
      - "scripts/prepare_tts_synthesis_text.py"
      - "scripts/qa_age_production.py"
      - "scripts/qa_font_coverage.py"
      - "scripts/qa_pronunciation.py"
      - "scripts/patch_bpmf_font.py"
      - "scripts/sync_bpmf_font.py"
      - ".github/workflows/preproduction_qa.yml"
  workflow_dispatch:

jobs:
  age8:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate TTS SDK retry controls
        run: |
          python -c "from scripts.generate_tts_assets import build_client_http_options; o=build_client_http_options(sdk_max_retries=0, request_timeout_seconds=30); assert o is not None; assert o.retry_options.attempts == 0; assert o.timeout == 30000"
          python -m py_compile scripts/generate_tts_assets.py
          python -m py_compile scripts/prepare_tts_synthesis_text.py
          python scripts/generate_tts_assets.py --help > /dev/null

      - name: Audit TTS text-layer pronunciation rules
        run: |
          python scripts/prepare_tts_synthesis_text.py --age 8 --audit-only --require-classified --require-production-ready

      - name: Rebuild pinned project font
        run: |
          python scripts/sync_bpmf_font.py
          python scripts/patch_bpmf_font.py --force

      - name: Age 8 structural and production gate
        run: python scripts/qa_age_production.py --age 8 --production-ready

      - name: Age 8 pronunciation source gate
        run: python scripts/inventory_pronunciation.py --age 8

      - name: Age 8 project-font coverage
        run: python scripts/qa_font_coverage.py --age 8

      - name: Pronunciation registry and font contract
        run: python scripts/qa_pronunciation.py

  age9-text:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Age 9 structural text gate
        run: python scripts/qa_age_production.py --age 9

      - name: Age 9 pronunciation source gate
        run: python scripts/inventory_pronunciation.py --age 9

      - name: Age 9 TTS text-rule audit
        run: python scripts/prepare_tts_synthesis_text.py --age 9 --audit-only

      - name: Rebuild pinned project font
        run: |
          python scripts/sync_bpmf_font.py
          python scripts/patch_bpmf_font.py --force

      - name: Age 9 project-font coverage
        run: python scripts/qa_font_coverage.py --age 9
